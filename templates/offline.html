<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline | AI Video Transcriber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 32rem;
            margin: 0 auto;
        }
        
        .offline-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
        
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
        }
        
        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
            background-color: var(--primary);
            color: white;
        }
        
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        .btn i {
            margin-right: 0.5rem;
        }
        
        .tips {
            margin-top: 3rem;
            text-align: left;
            max-width: 28rem;
        }
        
        .tips h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }
        
        .tips ul {
            list-style: none;
            padding: 0;
        }
        
        .tips li {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }
        
        .tips i {
            color: var(--primary);
            margin-right: 0.75rem;
            margin-top: 0.25rem;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
            }
            
            body {
                background-color: var(--bg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>You're Offline</h1>
        <p>It seems you've lost your internet connection. Please check your network settings and try again.</p>
        
        <button class="btn" onclick="window.location.reload()">
            <i class="fas fa-sync-alt"></i> Try Again
        </button>
        
        <div class="tips">
            <h3>While you're here, you can:</h3>
            <ul>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span>Check your Wi-Fi or mobile data connection</span>
                </li>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span>Make sure airplane mode is turned off</span>
                </li>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span>Try accessing the content later when you're back online</span>
                </li>
            </ul>
        </div>
    </div>
    
    <script>
        // Check for online status and reload when back online
        function handleConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }
        
        window.addEventListener('online', handleConnection);
        
        // Try to reload the page when the button is clicked
        document.querySelector('.btn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.reload();
        });
    </script>
</body>
</html>
